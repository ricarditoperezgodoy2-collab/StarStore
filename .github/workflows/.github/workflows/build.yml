name: Build StarStore IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare App Icon
        run: |
          mkdir -p StarStore/Assets.xcassets/AppIcon.appiconset
          if [ -f "IMG_0018.png" ]; then
            sips -z 1024 1024 IMG_0018.png --out StarStore/Assets.xcassets/AppIcon.appiconset/icon1024.png
            printf '{\n  "images" : [\n    {\n      "filename" : "icon1024.png",\n      "idiom" : "universal",\n      "platform" : "ios",\n      "size" : "1024x1024"\n    }\n  ],\n  "info" : {\n    "author" : "xcode",\n    "version" : 1\n  }\n}\n' > StarStore/Assets.xcassets/AppIcon.appiconset/Contents.json
          fi

      - name: Create project config
        run: |
          printf 'name: StarStore\noptions:\n  bundleIdPrefix: com.starstore\ntargets:\n  StarStore:\n    type: application\n    platform: iOS\n    deploymentTarget: "17.0"\n    sources:\n      - StarStore\n    settings:\n      base:\n        PRODUCT_BUNDLE_IDENTIFIER: com.starstore.app\n        INFOPLIST_KEY_CFBundleDisplayName: StarStore\n        INFOPLIST_KEY_UILaunchScreen_Generation: true\n        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait\n        MARKETING_VERSION: "1.0.0"\n        CURRENT_PROJECT_VERSION: "1"\n        CODE_SIGNING_ALLOWED: "NO"\n        CODE_SIGNING_REQUIRED: "NO"\n        CODE_SIGN_IDENTITY: ""\n' > project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild -project StarStore.xcodeproj -scheme StarStore -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/StarStore.app Payload/
          zip -r StarStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarStore-IPA
          path: StarStore.ipa
